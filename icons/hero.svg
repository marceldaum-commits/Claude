<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Ein Nachtfalter fliegt im Mondlicht über ein Terminal">
  <style>
    .s1{animation:t 3s ease-in-out infinite} .s2{animation:t 4.5s ease-in-out infinite 1s} .s3{animation:t 6s ease-in-out infinite 2s}
    @keyframes t{50%{opacity:.1}}
    .falter{animation:f 5s ease-in-out infinite; transform-origin:560px 150px}
    @keyframes f{50%{transform:translateY(-10px) rotate(-2deg)}}
    .cur{animation:c 1.1s steps(1) infinite} @keyframes c{50%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.s1,.s2,.s3,.falter,.cur{animation:none}}
  </style>
