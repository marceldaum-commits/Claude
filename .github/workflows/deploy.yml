# Veröffentlicht die App automatisch auf https://kali-level-up.pages.dev
# Voraussetzung: Repository-Secrets CLOUDFLARE_API_TOKEN (Recht: Cloudflare Pages – Edit)
# und CLOUDFLARE_ACCOUNT_ID. Siehe docs/CLOUDFLARE-DEPLOY.md, Abschnitt „Automatisch veröffentlichen“.
name: Veröffentlichen

on:
  push:
    branches: [main, ccr-63912bdd-xpv8bk]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prüfen (Syntax + Tests)
        run: npm run check
      - name: Veröffentlichungs-Ordner bauen
        run: tools/build-deploy.sh dist
      - name: Auf Cloudflare Pages hochladen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages deploy dist --project-name=kali-level-up --branch=main --commit-dirty=true
