# SEIT 04.11.2026 STILLGELEGT: Die App läuft auf dem eigenen Server (app.nachtfalter.tech / vorschau.nachtfalter.tech),
# geholt von /usr/local/sbin/nachtfalter-deploy (siehe deploy/). Dieser Workflow startet nur noch von Hand.
# Früher: Veröffentlicht die App automatisch (Freigabe-Ablauf):
#   Push auf den Arbeits-Branch  → VORSCHAU  https://vorschau.kali-level-up.pages.dev (Cloudflare Access wie live)
#   Push auf den Branch „live“   → ECHTE APP https://kali-level-up.pages.dev
# „live“ wird nur nach Marcels „ok“ im Chat aktualisiert.
# Voraussetzung: Repository-Secrets CLOUDFLARE_API_TOKEN (Recht: Cloudflare Pages – Edit)
# und CLOUDFLARE_ACCOUNT_ID. Siehe docs/CLOUDFLARE-DEPLOY.md, Abschnitt „Automatisch veröffentlichen“.
name: Veröffentlichen

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prüfen (Syntax + Tests)
        run: npm run check
      - name: Veröffentlichungs-Ordner bauen
        run: tools/build-deploy.sh dist
      - name: Auf Cloudflare Pages hochladen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages deploy dist --project-name=kali-level-up --branch=${{ github.ref_name == 'live' && 'main' || 'vorschau' }} --commit-dirty=true
